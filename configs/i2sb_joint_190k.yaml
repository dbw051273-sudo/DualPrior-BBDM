data:
  dataset_config:
    channels: 3
    dir_cond: input
    dir_target: target
    flip: false
    image_size: 256
    invert_cond: true
    organs:
    - label: 0
      path: /home/wangdb/data/Datasets_processed/liver
    - label: 1
      path: /home/wangdb/data/Datasets_processed/Kidney
    - label: 2
      path: /home/wangdb/data/Datasets_processed/Brain
    per_organ_limit: null
    to_normal: true
  dataset_name: ws300-e3
  dataset_type: multi_organ
  test:
    batch_size: 1
  train:
    batch_size: 4
    shuffle: true
  val:
    batch_size: 1
    shuffle: true
model:
  BB:
    lr_scheduler:
      cooldown: 3000
      factor: 0.5
      min_lr: 5.0e-07
      patience: 3000
      threshold: 0.0001
    optimizer:
      beta1: 0.9
      lr: 0.0001
      optimizer: Adam
      weight_decay: 0.0
    params:
      UNetParams:
        ape: true
        attn_drop_rate: 0.0
        condition_key: SpatialRescaler
        depths:
        - 4
        - 4
        - 4
        - 2
        drop_path_rate: 0.05
        drop_rate: 0.0
        final_upsample: expand_first
        image_size: 256
        in_channels: 6
        latent_mode: false
        mlp_ratio: 4.0
        model_channels: 256
        num_classes: 3
        num_heads:
        - 4
        - 8
        - 16
        - 32
        patch_norm: true
        patch_size: 2
        qkv_bias: true
        window_size: 8
      beta_schedule: linear
      num_timesteps: 1000
      sample_steps: 20
      sigma_max: 1.0
      sample_eta: 0.0
      loss_type: l1
      task_weights:
      - 1.0
      - 0.8
  EMA:
    use_ema: true
    ema_decay: 0.99
    start_ema_step: 90000
    update_ema_interval: 8
    apply_during_training: false
  latent_before_quant_conv: false
  model_load_path: null
  model_name: I2SB-JOINT-190K
  model_type: I2SB
  normalize_latent: false
  only_load_latent_mean_std: false
  optim_sche_load_path: null
runner: BBDMRunner
testing:
  clip_denoised: true
  noise_level: 0
  sample_num: 1
  sample_task: 0
training:
  accumulate_grad_batches: 1
  device:
  - 0
  n_epochs: 301
  n_steps: 190000
  num_workers: 8
  sample_freq: 30000
  sample_interval: 1
  save_freq: 10000
  save_interval: 1
  use_DDP: false
  use_amp: true
  validation_interval: 999
  lr_milestones:
  - 225000
  - 315000
  - 405000
  lr_factors:
  - 1.0
  - 0.5
  - 0.25
  - 0.1
  task1_end_step: 90000
  grad_clip_norm: 5.0
  skip_final_validation: true
